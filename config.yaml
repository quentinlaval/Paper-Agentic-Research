# ─────────────────────────────────────────────────────────────
# Décrivez vos centres d'intérêt en une ou deux phrases : c'est ce
# texte que le LLM utilisera pour juger la pertinence de chaque papier.
# Soyez spécifique : plus la description est précise, meilleur est le tri.
# ─────────────────────────────────────────────────────────────
interests: >
  Mes centres d’intérêt se situent à l’interface entre **biostatistique, bioinformatique, modélisation mécanistique et pharmacométrie**, avec un focus sur les **vaccins, la dynamique virale et les modèles within-host**.
  **Analyse de données omiques :** RNA-seq, differential expression, batch effects, normalization, cross-platform normalization, **deconvolution cellulaire**, multi-omics.
  **Modélisation statistique et mécanistique :** Non-Linear Mixed Effects Models (NLME), Ordinary Differential Equations (ODE), mechanistic models, structural and practical identifiability, parameter estimation.
  **Applications biologiques :** vaccine research, viral dynamics, within-host models, intégration de données longitudinales et multi-omiques, enfin les données de séquençage de répertoire de récepteur cellulaires de l'immunité (AIRR) sur les lymphocytes B et T.
  **Outils :** Monolix. 
  Intérêt particulier pour l’**intégration de méthodes statistiques et de données multi-omiques avec des modèles mécanistiques** afin de caractériser la dynamique des systèmes biologiques et la réponse aux vaccins.


# Mots-clés utilisés pour interroger les APIs (OpenAlex, arXiv) et comme
# filtre de sécurité gratuit avant d'appeler le LLM. Un papier doit
# contenir au moins un de ces mots-clés dans son titre ou son résumé.
keywords:
  - "Vaccine"
  - "Statistical"
  - "Batch effect"
  - "Normalization"
  - "RNA-seq"
  - "Differential expression"
  - "Deconvolution"
  - "Multi-omic"
  - "Cross-platform normalization"
  - "Non-Linear Mixed Effect Models (NLME)"
  - "Ordinary Differential Equation (ODE)"
  - 'Mechanistic models'
  - "Identifiability"
  - "Viral dynamics"
  - "Within-host models"

# Catégories arXiv à surveiller en plus d'OpenAlex.
# Laissez la liste vide ([]) pour désactiver la source arXiv.
# Taxonomie complète : https://arxiv.org/category_taxonomy
arxiv_categories:
  - "stat.AP"
  - "math.ST"
  - "math.OC"
  - "math.NA"
  - "math.DS"
  - "math.CA"
  - "stat.CO"
  - "stat.ME"
  - "stat.ML"
  - "stat.OT"
  - "stat.TH"
  - "q-bio.PE"
  - "q-bio.QM"
  - "q-bio.OT"
  - "q-bio.MN"
  - "q-bio.CB"
  - "q-bio.GN"
  - "q-bio.BM"

# Nombre de jours couverts à chaque exécution.
# Doit être >= à l'intervalle du cron dans le workflow (voir .github/workflows)
# pour ne rater aucun papier entre deux exécutions.
days_back: 8

# Nombre max de résultats demandés par mot-clé et par source
max_results_per_query: 15

# Nombre max de résultats OpenAlex/medRxiv par mot-clé (recherche à l'année,
# pas au jour près : une valeur plus large que max_results_per_query évite
# de rater des articles récents mal classés par la recherche OpenAlex).
openalex_max_results: 80

# Inclure medRxiv (résolu automatiquement via l'API OpenAlex, pas de clé
# supplémentaire nécessaire).
include_medrxiv: false

# Nombre de papiers gardés dans le digest final (les mieux notés)
top_n: 20

# Score de pertinence minimum (0-10, attribué par le LLM) pour être retenu
min_score: 6

# Email de contact (recommandé, pas obligatoire) pour la "pool polie"
# d'OpenAlex, qui offre un accès plus rapide et plus fiable.
contact_email: ""

# Modèle Gemini utilisé pour le scoring. Si ce modèle est retiré un jour,
# la liste à jour est ici : https://ai.google.dev/gemini-api/docs/models
model: "gemini-3.1-flash-lite"
